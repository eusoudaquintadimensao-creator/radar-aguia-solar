name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore: ["data/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript, actions
          queries: security-extended
          config: |
            paths-ignore:
              - vendor
              - data
      - uses: github/codeql-action/analyze@v4
